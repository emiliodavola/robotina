# ============================================================================
# egress-proxy - Squid como unica salida a Internet de los agentes.
#
# Principios:
#   * Falla cerrado: solo se permite lo que figura en allowlist.txt. No hay
#     excepcion para redes locales ni para el propio host.
#   * Sin cache: no se guardan cuerpos de respuesta ni credenciales en disco.
#   * Sin URLs en los logs: los tokens de Telegram viajan en la ruta
#     (/bot<token>/...), asi que se registra metodo y estado, nunca la URL.
#   * Destino privado denegado: bloquea metadata de cloud (169.254.169.254) y
#     rangos internos para que un agente no use el proxy como pivote.
# ============================================================================

http_port 3128

# --- Identidad: no filtrar version ni topologia ------------------------------
visible_hostname egress-proxy
# Oculta la version de Squid en Via y en las paginas de error.
httpd_suppress_version_string on
forwarded_for delete
request_header_access From deny all
request_header_access Referer deny all
request_header_access X-Forwarded-For deny all

# --- Sin cache ---------------------------------------------------------------
cache deny all

# --- Sin pinger ICMP: el contenedor no tiene capabilities ---------------------
pinger_enable off

# --- Auditoria sin secretos --------------------------------------------------
# Formato deliberadamente sin %ru ni %>ru: la URL lleva el token del bot. El
# dominio si se registra: es lo que permite auditar y ajustar la allowlist.
logformat hardened %ts.%03tu client=%>a domain=%>rd method=%rm squid=%Ss http=%>Hs
access_log stdio:/var/log/squid/access.log hardened
cache_log /var/log/squid/cache.log
cache_store_log none

# --- Puertos permitidos ------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# --- Destinos permitidos / prohibidos ----------------------------------------
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

# Rangos que nunca deben alcanzarse a traves del proxy.
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl private_dst dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16
acl private_dst dst 198.18.0.0/15 224.0.0.0/4
acl private_dst dst ::1/128 fc00::/7 fe80::/10

# --- Politica: denegar por defecto ------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private_dst
http_access deny to_localhost
http_access allow allowed_domains
http_access deny all
