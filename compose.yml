# ============================================================================
# Robotina - un unico contenedor de agentes (Hermes gateway + opencode serve +
# engram) supervisados por s6-overlay, sobre un workspace compartido.
#
# Modelo de seguridad:
#   1. El agente no tiene ruta directa a Internet: vive solo en la red
#      `agents` (internal: true), que no tiene gateway hacia afuera.
#   2. La unica salida es `egress-proxy` (Squid), que solo acepta los dominios
#      declarados en squid/allowlist.txt. Todo lo demas se deniega.
#   3. Sin puertos publicados: nada entra desde el host ni desde la LAN. El
#      servidor HTTP de opencode escucha en 127.0.0.1 adentro del contenedor,
#      asi que ningun par de red puede alcanzarlo.
#   4. Contenedor sin capabilities, sin escalada de privilegios, con limites
#      de CPU/memoria/PIDs, core dumps desactivados y logs acotados.
#
# Secretos: se interpolan desde un `.env` externo (nunca versionado; ver
# .env.example). Riesgo residual asumido: las variables de entorno son legibles
# con `docker inspect`. Materializarlas como archivos requiere envolver los
# entrypoints de las imagenes.
#
# Nombres de las entradas: TODAS las entradas que vienen de `.env` llevan el
# prefijo `ROBOTINA_`. Docker Compose le da PRECEDENCIA al entorno del proceso
# por sobre el `.env`: si en el shell quedo exportada una variable con el mismo
# nombre que una de estas claves (el caso real fue `OPENCODE_GO_API_KEY`, el
# nombre propio del vendor), ese valor exportado pisa en silencio al del `.env`
# y el contenedor recibe una credencial vieja. Un prefijo que el host no usa
# elimina la colision. Los nombres INTERNOS (a la izquierda de cada linea de
# `environment:`) NO cambian: son los que espera cada componente adentro.
#
# Persistencia: el estado del agente (configuracion de Hermes y de opencode,
# identidad de git, memoria de engram y el workspace) vive en carpetas del host
# bajo HOST_DATA_DIR, no en volumenes nombrados de Docker. Son visibles,
# editables y respaldables como cualquier proyecto, y sobreviven a un reset de
# Docker Desktop. La excepcion son las dos bases SQLite en modo WAL, que van en
# volumenes NATIVOS anidados dentro de ese bind (ver `volumes:` al pie).
# HOST_DATA_DIR se define en `.env` y es obligatorio: si falta, el stack no
# arranca, para que el estado nunca termine escondido adentro del repo.
# ============================================================================

# Baseline aplicado a los dos servicios. `pids_limit` SALE del ancla: es un
# presupuesto dimensionado, no una constante de hardening, y ahora difiere 8x
# entre el agente y el proxy.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    core: 0
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# El agente solo puede salir por el proxy. Los clientes que ignoren estas
# variables fracasan en vez de evadir el control de egreso. El nombre interno
# del unico agente es `robotina`; el salto a loopback (127.0.0.1) nunca pasa
# por Squid.
x-egress-env: &egress-env
  HTTP_PROXY: http://egress-proxy:3128
  HTTPS_PROXY: http://egress-proxy:3128
  http_proxy: http://egress-proxy:3128
  https_proxy: http://egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,::1,robotina,egress-proxy
  no_proxy: localhost,127.0.0.1,::1,robotina,egress-proxy

services:
  # --------------------------------------------------------------------------
  # Unica puerta hacia Internet. Squid corre como usuario `proxy` (uid 13) con
  # rootfs de solo lectura y sin capabilities: si lo comprometen, no puede
  # dejar binarios en disco ni escalar privilegios.
  # --------------------------------------------------------------------------
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: egress-proxy
    restart: unless-stopped
    # El CMD de la imagen ya apunta a /etc/squid/squid.conf.
    user: "13:13" # usuario `proxy`: no necesita setuid ni capabilities
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    tmpfs:
      # Squid escribe logs, cache y pid file: van a memoria, nunca al disco.
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,mode=0750,uid=13,gid=13
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=16m,mode=0750,uid=13,gid=13
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0750,uid=13,gid=13
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      # Politica y allowlist: solo lectura desde el contenedor.
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowlist.txt:/etc/squid/allowlist.txt:ro
    networks:
      # Lado agentes: recibe los pedidos.
      - agents
      # Unico contenedor con gateway hacia afuera.
      - egress
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    <<: *hardening

  # --------------------------------------------------------------------------
  # Unico agente del stack: Hermes (bot de Telegram) + `opencode serve` +
  # engram, supervisados por s6-overlay adentro del mismo contenedor. Sin red
  # de Internet propia.
  #
  # La imagen es derivada (robotina/Dockerfile): parte de la imagen vendor de
  # Hermes (Debian, glibc, s6-overlay) y le agrega la toolchain que tenia la
  # imagen de opencode (node, npm, python, git, gh, los LSP, engram, gentle-ai).
  # --------------------------------------------------------------------------
  robotina:
    build:
      context: ./robotina
    image: robotina:local
    container_name: robotina
    restart: unless-stopped
    # Sin `init: true`: Hermes corre s6-overlay y exige ser PID 1. Con el init de
    # Docker como PID 1 el entrypoint degrada ("skipping s6-overlay /init...
    # Supervised services are unavailable") y no levantaria sus servicios.
    # Tampoco `user:`: la imagen rechaza un UID arbitrario; para mapear al UID
    # del host van HERMES_UID / HERMES_GID manteniendo root en el arranque.
    # opencode y engram no son hijos en background de un entrypoint: se declaran
    # como servicios propios en el bundle `user2` de s6 (robotina/s6/).
    command: ["gateway", "run"]
    environment:
      <<: *egress-env
      TZ: America/Argentina/Buenos_Aires
      # Las entradas `${...}` vienen de `.env` y llevan prefijo `ROBOTINA_` por
      # el shadowing descrito arriba. Hermes usa su clave con el nombre exacto
      # que espera la imagen vendor.
      OPENCODE_GO_API_KEY: ${ROBOTINA_HERMES_MODEL_KEY:?definir ROBOTINA_HERMES_MODEL_KEY en .env}
      # La clave de opencode viaja bajo un nombre propio: el run script de su
      # servicio la exporta como OPENCODE_GO_API_KEY SOLO para su proceso (nunca
      # se parchea un archivo del vendor).
      ROBOTINA_OPENCODE_GO_API_KEY: ${ROBOTINA_OPENCODE_MODEL_KEY:?definir ROBOTINA_OPENCODE_MODEL_KEY en .env}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${ROBOTINA_TELEGRAM_BOT_TOKEN:?definir ROBOTINA_TELEGRAM_BOT_TOKEN en .env}
      # Quien puede hablarle al bot. Vacio (default) = fail closed: Hermes manda
      # un codigo de pairing a los DM desconocidos y los rechaza hasta que se
      # aprueben. Para autorizarte sin abrir el dashboard, pon tu ID numerico
      # de Telegram (te lo da @userinfobot) en .env:
      #   ROBOTINA_TELEGRAM_ALLOWED_USERS=123456789
      TELEGRAM_ALLOWED_USERS: ${ROBOTINA_TELEGRAM_ALLOWED_USERS:-}
      # Token de GitHub (decision D3): `gh` y el credential helper de git lo
      # leen de aca, sin `gh auth login`. Riesgo asumido: el agente que habla por
      # Telegram ahora comparte contenedor con este token, y el token es legible
      # con `docker inspect`.
      GITHUB_TOKEN: ${ROBOTINA_GITHUB_TOKEN:-}
      # Modelo de Hermes (NO son secretos). Los consume el cont-init
      # 30-robotina-model, que apunta `config.yaml` a este proveedor, endpoint y
      # modelo. Si no se definen en .env, se usan los defaults entre parentesis.
      # Provider explicito (`opencode-go`) en vez de `auto`: con `auto` Hermes
      # resuelve al unico proveedor con credencial y adivina, y los errores se
      # vuelven indescifrables.
      ROBOTINA_HERMES_MODEL: ${ROBOTINA_HERMES_MODEL:-deepseek-v4.1-flash}
      ROBOTINA_HERMES_MODEL_PROVIDER: ${ROBOTINA_HERMES_MODEL_PROVIDER:-opencode-go}
      ROBOTINA_HERMES_MODEL_BASE_URL: ${ROBOTINA_HERMES_MODEL_BASE_URL:-https://opencode.ai/zen/go/v1}
      # Raiz(es) escribible(s) de las herramientas de archivo de Hermes. La
      # imagen vendor la hornea como `/opt/data/` (= HERMES_HOME), asi que el
      # agente no puede escribir en el proyecto montado en /workspace. Se
      # AMPLIA, no se reemplaza: es una lista `os.pathsep`-separada (`:`), con
      # /opt/data/ primero (HERMES_HOME sigue cubierto) y /workspace/ como raiz
      # de trabajo. Decision: el workspace entero, no un proyecto puntual (ver
      # AC10). Las dos entradas son directorios, por eso llevan barra final; la
      # guarda las normaliza con realpath. Override opcional en .env con la
      # clave ROBOTINA_HERMES_WRITE_SAFE_ROOT.
      HERMES_WRITE_SAFE_ROOT: ${ROBOTINA_HERMES_WRITE_SAFE_ROOT:-/opt/data/:/workspace/}
      # Sin prompts interactivos de credenciales: falla rapido en lugar de
      # quedarse esperando una respuesta que nunca va a llegar.
      GIT_TERMINAL_PROMPT: "0"
      # Password del servidor de opencode, defensa en profundidad y no frontera:
      # el puerto es loopback-only, asi que ningun par de red lo alcanza. Vacio
      # = servidor sin autenticar. Poniendo el mismo valor en .env, Hermes y el
      # run script de opencode lo usan para hablarle.
      OPENCODE_SERVER_PASSWORD: ${ROBOTINA_OPENCODE_SERVER_PASSWORD:-}
      # Rutas, no configuracion por proceso: las necesitan tambien los `exec`
      # de operador (git config --global, engram export, go env).
      ENGRAM_DATA_DIR: /opt/data/.engram
      GIT_CONFIG_GLOBAL: /opt/data/.config/git/config
      GOPATH: /opt/data/go
    volumes:
      # Estado del agente en el host: configuracion de Hermes, sesiones,
      # memoria, credenciales y logs; y adentro suyo la config de opencode, la
      # identidad de git y el cache de Go, porque HOME=/opt/data para los dos
      # arboles de procesos.
      - type: bind
        source: ${HOST_DATA_DIR:?definir HOST_DATA_DIR en .env, por ej. C:/robotina-data}/hermes
        target: /opt/data
      # Workspace compartido, tambien en el host.
      - type: bind
        source: ${HOST_DATA_DIR:?definir HOST_DATA_DIR en .env, por ej. C:/robotina-data}/workspace
        target: /workspace
      # Salida de scripts/export-state.sh: JSON legible y portable, en el host.
      - type: bind
        source: ${HOST_DATA_DIR:?definir HOST_DATA_DIR en .env, por ej. C:/robotina-data}/backups
        target: /backups
      # Skills propias del stack, agrupadas en su propia categoria. Read-only:
      # el agente no puede reescribir sus propias instrucciones. Una sola montura
      # para todas, asi sumar una skill no obliga a tocar compose.
      - type: bind
        source: ./hermes/skills
        target: /opt/data/skills/stack
        read_only: true
      # Skin de identidad `robotina`. Read-only: el agente no puede reescribir
      # su propio archivo de identidad. Se monta el directorio entero para que
      # sumar otra skin no obligue a tocar compose.
      - type: bind
        source: ./hermes/skins
        target: /opt/data/skins
        read_only: true
      # Hechos del entorno + la regla de credenciales, en el archivo de contexto de
      # MAYOR prioridad que Hermes busca desde su cwd. Como el cwd de la terminal es
      # /workspace (config terminal.cwd), esto entra en TODOS los prompts, sin
      # depender de que el modelo decida abrir una skill. Read-only: el agente no
      # reescribe sus propias instrucciones.
      - type: bind
        source: ./hermes/context/.hermes.md
        target: /workspace/.hermes.md
        read_only: true
      # Sesiones y base propia de opencode (opencode.db): volumen NATIVO anidado
      # dentro del bind de /opt/data. opencode fuerza WAL, y WAL sobre
      # virtiofs/9p (carpetas de Windows) puede corromperse en silencio — es lo
      # que Hermes denuncia y lo que medimos: engram re-activa WAL al escribir,
      # no hay forma de fijarlo en rollback. El nombre del volumen es el mismo de
      # antes de la fusion, asi que el rollback lo vuelve a montar en su ruta
      # vieja. Sin este volumen el historial vive en la capa del contenedor y se
      # pierde en cada recreate.
      - type: volume
        source: opencode_db
        target: /opt/data/.local/share/opencode
      # Cerebro de engram (SQLite en modo WAL), mismo motivo y mismo trato. El
      # estado se saca al host en JSON con scripts/export-state.sh.
      - type: volume
        source: engram_db
        target: /opt/data/.engram
      # El script de export, versionado en el repo y de solo lectura.
      - type: bind
        source: ./scripts/export-state.sh
        target: /opt/export-state.sh
        read_only: true
    tmpfs:
      # Escrituras temporales solo en memoria: no quedan residuos en el disco
      # del host ni en la capa del contenedor.
      # `exec` es obligatorio: Docker agrega noexec a todo tmpfs salvo que lo
      # pidas explicito (medido con /proc/mounts). OpenTUI extrae una .so a /tmp
      # y la carga con dlopen; sobre un tmpfs noexec eso falla con EPERM y el
      # contenedor entra en crash loop.
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    networks:
      # Unica red del agente: habla con el proxy y consigo mismo por loopback.
      # Sin salida directa.
      - agents
    mem_limit: 6g
    cpus: 6.0
    # Presupuesto de procesos del cgroup fusionado (Hermes + opencode + sus LSP
    # + engram + builds). Es un presupuesto dimensionado, no una constante de
    # hardening: se confirma o se ajusta con la medicion de pids.current bajo el
    # peor caso concurrente.
    pids_limit: 1024
    # Observabilidad, no recuperacion: `restart: unless-stopped` actua sobre la
    # salida de PID 1, no sobre el health status. Sin este healthcheck, un
    # opencode o un engram en crash loop son invisibles en `docker compose ps`.
    healthcheck:
      test: ["CMD", "/opt/robotina/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    <<: *hardening
    # s6-overlay baja privilegios con `s6-setuidgid hermes` (initgroups →
    # SETUID/SETGID), ajusta el dueno del volumen (CHOWN/DAC_OVERRIDE/FOWNER) y
    # necesita poder senalar a sus hijos de uid 10000 para bajarlos (KILL).
    # Con `cap_drop: [ALL]` el arranque muere con:
    #   s6-applyuidgid: fatal: unable to set supplementary group list: Operation not permitted
    # Sin KILL el arranque funciona pero el apagado iniciado adentro se traba:
    # los supervisores root no pueden senalar a los servicios de uid 10000, el
    # arbol s6 no baja, PID 1 no sale y Docker termina mandando SIGKILL pasado
    # `stop_grace_period`. Medido: los procesos de uid 10000 quedan con
    # CapEff=0x0, asi que no pueden ganar KILL por su cuenta; readmitirla en el
    # contenedor restaura la mecanica de supervision sin ampliar lo que puede
    # hacer el agente. Mascara de bounding set resultante: 0xeb.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]

# Bases SQLite en modo WAL: en volumenes NATIVOS anidados dentro del bind de
# /opt/data, porque WAL sobre una carpeta de Windows puede corromperse en
# silencio. Los nombres son los mismos de antes de la fusion, asi que el
# rollback los vuelve a montar en sus rutas viejas. Para sacar estas dos bases
# al host: scripts/export-state.sh.
volumes:
  opencode_db:
    name: robotina_opencode_db
  engram_db:
    name: robotina_engram_db

networks:
  # Red privada entre el agente y el proxy.
  # internal: true => sin gateway hacia Internet para nadie que este aca.
  agents:
    name: agents
    internal: true
  # Red con salida a Internet. La usa unicamente el proxy de egreso.
  egress:
    name: egress
    driver: bridge
