# openspec/config.yaml — SDD configuration for robotina
# Generated by sdd-init on 2026-09-22.
# Mode: openspec (files under openspec/ are the artifact store of record).
schema: spec-driven

context: |
  Project: robotina — an autonomous-agent container stack, not an application.
  Stack: Docker Compose v2 (Compose file `compose.yml`) + Dockerfiles. Docker 29.8.0 /
  Docker Compose v5.5.1 verified on the authoring host (Windows + Docker Desktop).
  Services today: `hermes` (vendor image `nousresearch/hermes-agent`, s6-overlay as PID 1,
  app uid 10000, needs cap_add CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID, no `init: true`),
  `opencode` (custom image built from `opencode/Dockerfile` over `ghcr.io/anomalyco/opencode`,
  runs as uid 10000, `opencode serve` on the internal network), `egress-proxy`
  (`ubuntu/squid:latest`, uid 13, read-only rootfs, sole container with Internet egress).
  Networks: `agents` (internal: true, no gateway) + `egress` (bridge). No published ports.
  Persistence: host folders under ${HOST_DATA_DIR}; WAL SQLite DBs on native Docker volumes
  (`robotina_opencode_db`, `robotina_engram_db`).
  Testing: NO unit-test framework exists in this repository (no Python/JS/Go test suite).
  This is an infrastructure/container stack; verification is shell-level, recorded below.
  Language: README.md, SECURITY.md and code comments are Spanish; README.en.md is English;
  odd/tasks/*.md are English. Preserve the per-file language convention — do not translate.
  Secrets: a gitignored `.env` is interpolated by compose; `.env.example` documents the keys.

strict_tdd: false

testing:
  strict_tdd: false
  test_command: null            # no unit-test runner exists in this repo — do not invent one
  runner: none                  # infrastructure/container stack
  runner_version: null
  layers:
    unit: {available: false, tool: null}
    integration: {available: false, tool: null}
    e2e: {available: false, tool: null}
  static_validation:
    available: true
    command: "docker compose config -q"
    note: >-
      Use the `-q` form ONLY. The bare form (without `-q`) resolves and PRINTS .env values
      (Telegram token, both model API keys, OPENCODE_SERVER_PASSWORD) into stdout and any
      transcript that captures it. Never run the unfiltered form, and never delegate a task
      that may run it without stating this explicitly.
    services_inventory: "docker compose config --services"
  build:
    available: true
    command: "docker compose build"
    per_service: "docker compose build opencode   # target image after the merge: robotina"
  runtime:
    available: true
    bring_up: "docker compose up -d"
    service_count_check: "docker compose ps"
    probes:
      - "docker compose exec <service> sh -c '<in-container probe>'"
      - "loopback check — curl -fsS http://127.0.0.1:4096/global/health from inside the agent container"
      - "isolation check — the same loopback URL MUST fail from the host and from egress-proxy"
      - "key-isolation check — verify each process sees only its own API key env var"
  doc_and_secret_greps:
    available: true
    stale_claim_grep: "grep -rn 'hermes\\|opencode' README.md README.en.md SECURITY.md hermes/ | grep -v <expected>"
    secret_leak_grep: "git grep -nE '(TELEGRAM_BOT_TOKEN|OPENCODE_GO_API_KEY|GITHUB_TOKEN)=.+' -- ':!*.example'"
    note: ".env is gitignored; assert no real secret value ever appears in a tracked file."
  quality:
    linter: {available: false, command: null}
    type_checker: {available: false, command: null}
    formatter: {available: false, command: null}
  pre_commit: "none configured"

delivery:
  artifact_store: openspec
  strategy: ask-on-risk
  review_budget_lines: 400
  chain_strategy: deferred      # no chaining chosen yet; ask before inventing one
  exception_ok: false           # size:exception is never inferred
  branch_policy: "feature branch only; never commit to main, merge via PR"
  current_branch: feat/single-robotina-container

rules:
  proposal:
    - "Include intent, scope (in/out), and approach; reference the openspec specs it touches."
    - "Include a rollback plan (compose/Dockerfile changes are revertible as a unit)."
    - "Preserve the security invariants: no published ports, no direct Internet for agents,
      egress only through `egress-proxy`, no Docker socket, secrets only via `.env`."
    - "Do not propose merging `egress-proxy` into the agent container (out of scope by user decision)."
  specs:
    - "Use Given/When/Then scenarios; use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)."
    - "Every scenario MUST be checkable with a shell-level verification recipe from the
      `testing` section (compose config/build/up + in-container probes + greps) — there is no
      test runner to assert it."
    - "Name the exact command that proves each scenario, so `sdd-verify` can run it."
  design:
    - "Document image composition (base image, added toolchain) and why; s6-overlay PID 1
      constraints; uid/permission alignment; and per-process API-key isolation."
    - "Document startup ordering as a sequence (s6 services vs `opencode serve` vs engram)."
    - "Record architecture decisions with rationale; keep the egress boundary untouched."
  tasks:
    - "Group by phase, use hierarchical numbering; keep tasks completable in one session."
    - "Each task MUST name its verification command (compose/build/runtime probe/grep)."
    - "Re-forecast review workload after `sdd-tasks`; if it exceeds 400 authored lines,
      stop and ask (ask-on-risk) instead of choosing chaining or an exception."
  apply:
    - "Follow existing compose conventions: anchors (`x-hardening`, `x-egress-env`), Spanish
      comments in compose.yml/Dockerfile, English in odd/tasks and openspec artifacts."
    - "tdd: false"
    - "test_command: null"
    - "verify_command: docker compose config -q && docker compose build"
    - "Never run the static-validation command without `-q` (secret leak, see testing.static_validation)."
  verify:
    - "static: docker compose config -q"
    - "build: docker compose build"
    - "runtime: docker compose up -d && docker compose ps   # expect exactly robotina + egress-proxy"
    - "probes: in-container loopback health check, cross-container/host isolation check, key-isolation check"
    - "docs: grep for stale two-container claims in README.md, README.en.md, SECURITY.md, hermes/"
    - "secrets: grep tracked files for real secret values (must find none)"
  archive:
    - "Warn before merging destructive deltas."
    - "Record the final measured service list and image digests in the archived change."
